<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>车辆预占登记系统</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            margin: 30px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-box {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 25px;
            background: #fafafa;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-row label {
            width: 90px;
            font-weight: bold;
        }
        select, input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0056b3;
        }
        /* 表格容器 - 核心修改 */
        .table-container {
            max-height: 400px; /* 可自定义表格最大高度 */
            overflow-y: auto;  /* 垂直滚动 */
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        /* 表头固定样式 */
        table th {
            background: #007bff;
            color: white;
            position: sticky;    /* 粘性定位 */
            top: 0;              /* 固定在顶部 */
            z-index: 10;         /* 防止被遮挡 */
        }
        table tr:nth-child(even) {
            background: #f8f9fa;
        }
        .admin-btn {
            background: #6c757d;
            margin-bottom: 15px;
        }
        .logout-btn {
            background: #dc3545;
            margin-left: 10px;
        }
        .admin-box {
            display: none;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #fff8e1;
        }
        .admin-item {
            margin-bottom: 15px;
        }
        .admin-item h4 {
            margin: 0 0 10px 0;
        }
        .login-box {
            margin-bottom: 15px;
            display: none;
        }
        /* 新增提示样式 */
        .tips {
            color: #666;
            font-size: 12px;
            margin-left: 10px;
        }
        /* 输入框错误样式 */
        .input-error {
            border-color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>车辆预占登记系统</h2>

    <button class="admin-btn" onclick="AdminModule.showAdminLogin()">管理员后台</button>
    <button class="logout-btn" onclick="AdminModule.exitAdmin()" style="display:none;" id="exitBtn">退出管理员</button>

    <div class="login-box" id="loginBox">
        <input type="text" id="adminUser" placeholder="账号">
        <input type="password" id="adminPwd" placeholder="密码">
        <button onclick="AdminModule.adminLogin()">登录</button>
    </div>

    <div class="admin-box" id="adminBox">
        <div class="admin-item">
            <h4>车牌管理</h4>
            <input type="text" id="newPlate" placeholder="输入车牌（如：京A12345）">
            <button onclick="AdminModule.addPlate()">添加</button>
            <div id="plateList" class="tips">已添加的车牌会自动同步到下拉框</div>
        </div>
        <div class="admin-item">
            <h4>单位管理</h4>
            <input type="text" id="newDept" placeholder="输入单位名称（如：技术部）">
            <button onclick="AdminModule.addDept()">添加</button>
            <div id="deptList" class="tips">已添加的单位会自动同步到下拉框</div>
        </div>
    </div>

    <div class="form-box">
        <div class="form-row">
            <label>车牌：</label>
            <select id="carPlate"></select>
            <label>单位：</label>
            <select id="unit"></select>
        </div>

        <div class="form-row">
            <label>使用人：</label>
            <input type="text" id="userName" placeholder="请输入使用人姓名">
        </div>

        <div class="form-row">
            <label>预占日期：</label>
            <input type="number" id="year" placeholder="年" min="2024" max="2099">
            <input type="number" id="month" placeholder="月" min="1" max="12">
            <input type="number" id="day" placeholder="日" min="1" max="31">
            <span class="tips" id="dateTips"></span>
        </div>

        <div class="form-row">
            <label>开始时间：</label>
            <input type="number" id="s_hour" placeholder="时" min="0" max="23">
            <input type="number" id="s_minute" placeholder="分" min="0" max="59">
        </div>

        <div class="form-row">
            <label>结束时间：</label>
            <input type="number" id="e_hour" placeholder="时" min="0" max="23">
            <input type="number" id="e_minute" placeholder="分" min="0" max="59">
        </div>

        <div class="form-row">
            <label>事由：</label>
            <input type="text" id="reason" style="width: 500px;" placeholder="请输入详细使用事由（必填）">
            <button onclick="RecordModule.applyRecord()">申请占用</button>
        </div>
    </div>

    <!-- 新增表格容器 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>车牌</th>
                    <th>日期</th>
                    <th>开始</th>
                    <th>结束</th>
                    <th>单位</th>
                    <th>使用人</th>
                    <th>事由</th>
                    <th id="actionTh">操作</th>
                </tr>
            </thead>
            <tbody id="recordTable"></tbody>
        </table>
    </div>
</div>

<script>
// 全局常量配置
const CONFIG = {
    ADMIN_USER: "admin",
    ADMIN_PWD: "123456",
    STORAGE_KEYS: {
        PLATES: "plates",
        UNITS: "units",
        RECORDS: "records"
    },
    DEFAULT_PLATES: ["京A12345", "沪B67890", "粤C00001", "苏D22222"],
    DEFAULT_UNITS: ["办公室", "财务部", "技术部", "行政部"]
};

// 本地存储模块
const StorageModule = {
    // 读取数据
    load(key) {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : null;
    },
    // 保存数据
    save(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
    }
};

// 数据管理模块
const DataModule = {
    plates: [],
    units: [],
    records: [],
    isAdmin: false,

    // 初始化数据
    init() {
        this.plates = StorageModule.load(CONFIG.STORAGE_KEYS.PLATES) || CONFIG.DEFAULT_PLATES;
        this.units = StorageModule.load(CONFIG.STORAGE_KEYS.UNITS) || CONFIG.DEFAULT_UNITS;
        this.records = StorageModule.load(CONFIG.STORAGE_KEYS.RECORDS) || [];
    },

    // 保存所有数据
    saveAll() {
        StorageModule.save(CONFIG.STORAGE_KEYS.PLATES, this.plates);
        StorageModule.save(CONFIG.STORAGE_KEYS.UNITS, this.units);
        StorageModule.save(CONFIG.STORAGE_KEYS.RECORDS, this.records);
    },

    // 时间转时间戳
    getTimeStamp(year, month, day, hour, minute) {
        return new Date(year, month - 1, day, hour, minute).getTime();
    },

    // 校验日期合法性
    isDateValid(year, month, day) {
        const date = new Date(year, month - 1, day);
        return date.getFullYear() == year && 
               date.getMonth() + 1 == month && 
               date.getDate() == day;
    },

    // 冲突检测
    checkConflict(plate, dateStr, startTs, endTs) {
        return this.records.some(record => {
            return record.plate === plate && 
                   record.dateStr === dateStr && 
                   !(endTs <= record.startTime || startTs >= record.endTime);
        });
    }
};

// 下拉框初始化模块
const SelectModule = {
    // 初始化车牌下拉框
    initPlateSelect() {
        const plateSel = document.getElementById("carPlate");
        plateSel.innerHTML = "";
        DataModule.plates.forEach(plate => {
            const option = document.createElement("option");
            option.value = plate;
            option.textContent = plate;
            plateSel.appendChild(option);
        });
    },

    // 初始化单位下拉框
    initUnitSelect() {
        const unitSel = document.getElementById("unit");
        unitSel.innerHTML = "";
        DataModule.units.forEach(unit => {
            const option = document.createElement("option");
            option.value = unit;
            option.textContent = unit;
            unitSel.appendChild(option);
        });
    },

    // 初始化所有下拉框
    initAll() {
        this.initPlateSelect();
        this.initUnitSelect();
    }
};

// 表格渲染模块
const TableModule = {
    // 渲染登记记录表格
    renderRecords() {
        const tableBody = document.getElementById("recordTable");
        const actionTh = document.getElementById("actionTh");
        tableBody.innerHTML = "";

        // 控制操作列显示
        actionTh.style.display = DataModule.isAdmin ? "table-cell" : "none";

        DataModule.records.forEach((item, index) => {
            const tr = document.createElement("tr");
            const delBtn = DataModule.isAdmin 
                ? `<button onclick="RecordModule.deleteRecord(${index})">删除</button>` 
                : "";

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.plate}</td>
                <td>${item.dateStr}</td>
                <td>${item.sShow}</td>
                <td>${item.eShow}</td>
                <td>${item.unit}</td>
                <td>${item.user}</td>
                <td>${item.reason}</td>
                <td>${delBtn}</td>
            `;
            tableBody.appendChild(tr);
        });
    },

    // 渲染管理员列表（车牌/单位）
    renderAdminLists() {
        const plateList = document.getElementById("plateList");
        const deptList = document.getElementById("deptList");
        
        // 渲染车牌列表
        plateList.innerHTML = "";
        DataModule.plates.forEach((plate, index) => {
            plateList.innerHTML += `<div>${plate} <button onclick="AdminModule.deletePlate(${index})">删除</button></div>`;
        });

        // 渲染单位列表
        deptList.innerHTML = "";
        DataModule.units.forEach((unit, index) => {
            deptList.innerHTML += `<div>${unit} <button onclick="AdminModule.deleteDept(${index})">删除</button></div>`;
        });
    }
};

// 管理员模块
const AdminModule = {
    // 显示管理员登录框
    showAdminLogin() {
        document.getElementById("loginBox").style.display = "block";
    },

    // 管理员登录
    adminLogin() {
        const user = document.getElementById("adminUser").value.trim();
        const pwd = document.getElementById("adminPwd").value.trim();

        if (user === CONFIG.ADMIN_USER && pwd === CONFIG.ADMIN_PWD) {
            DataModule.isAdmin = true;
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminBox").style.display = "block";
            document.getElementById("exitBtn").style.display = "inline-block";
            TableModule.renderAdminLists();
            TableModule.renderRecords();
            alert("管理员登录成功！");
        } else {
            alert("账号或密码错误！");
        }
    },

    // 退出管理员
    exitAdmin() {
        DataModule.isAdmin = false;
        document.getElementById("adminBox").style.display = "none";
        document.getElementById("exitBtn").style.display = "none";
        TableModule.renderRecords();
        alert("已退出管理员模式！");
    },

    // 添加车牌
    addPlate() {
        const newPlate = document.getElementById("newPlate").value.trim();
        if (!newPlate) {
            alert("请输入有效的车牌！");
            return;
        }
        if (DataModule.plates.includes(newPlate)) {
            alert("该车牌已存在！");
            return;
        }
        DataModule.plates.push(newPlate);
        DataModule.saveAll();
        SelectModule.initPlateSelect();
        TableModule.renderAdminLists();
        document.getElementById("newPlate").value = "";
    },

    // 删除车牌
    deletePlate(index) {
        if (confirm("确定要删除该车牌吗？删除后将无法恢复！")) {
            DataModule.plates.splice(index, 1);
            DataModule.saveAll();
            SelectModule.initPlateSelect();
            TableModule.renderAdminLists();
        }
    },

    // 添加单位
    addDept() {
        const newDept = document.getElementById("newDept").value.trim();
        if (!newDept) {
            alert("请输入有效的单位名称！");
            return;
        }
        if (DataModule.units.includes(newDept)) {
            alert("该单位已存在！");
            return;
        }
        DataModule.units.push(newDept);
        DataModule.saveAll();
        SelectModule.initUnitSelect();
        TableModule.renderAdminLists();
        document.getElementById("newDept").value = "";
    },

    // 删除单位
    deleteDept(index) {
        if (confirm("确定要删除该单位吗？删除后将无法恢复！")) {
            DataModule.units.splice(index, 1);
            DataModule.saveAll();
            SelectModule.initUnitSelect();
            TableModule.renderAdminLists();
        }
    }
};

// 登记记录模块
const RecordModule = {
    // 自动填充当前时间
    fillCurrentTime() {
        const now = new Date();
        document.getElementById("year").value = now.getFullYear();
        document.getElementById("month").value = now.getMonth() + 1;
        document.getElementById("day").value = now.getDate();
        document.getElementById("s_hour").value = now.getHours();
        document.getElementById("s_minute").value = now.getMinutes();
        document.getElementById("e_hour").value = now.getHours() + 1;
        document.getElementById("e_minute").value = now.getMinutes();
    },

    // 申请占用车辆
    applyRecord() {
        // 获取表单值
        const plate = document.getElementById("carPlate").value;
        const unit = document.getElementById("unit").value;
        const userName = document.getElementById("userName").value.trim();
        const reason = document.getElementById("reason").value.trim();
        
        const year = parseInt(document.getElementById("year").value);
        const month = parseInt(document.getElementById("month").value);
        const day = parseInt(document.getElementById("day").value);
        const sHour = parseInt(document.getElementById("s_hour").value);
        const sMinute = parseInt(document.getElementById("s_minute").value);
        const eHour = parseInt(document.getElementById("e_hour").value);
        const eMinute = parseInt(document.getElementById("e_minute").value);

        // 基础校验
        const dateTips = document.getElementById("dateTips");
        dateTips.textContent = "";
        if (!userName) {
            alert("使用人姓名不能为空！");
            return;
        }
        if (!reason) {
            alert("使用事由不能为空！");
            return;
        }
        if (isNaN(year) || isNaN(month) || isNaN(day)) {
            alert("请填写完整的预占日期！");
            return;
        }
        if (isNaN(sHour) || isNaN(sMinute) || isNaN(eHour) || isNaN(eMinute)) {
            alert("请填写完整的时间信息！");
            return;
        }

        // 日期合法性校验
        if (!DataModule.isDateValid(year, month, day)) {
            dateTips.textContent = "⚠️ 日期不合法（如2月30日）";
            dateTips.style.color = "#dc3545";
            return;
        }

        // 格式化日期和时间
        const dateStr = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        const startTs = DataModule.getTimeStamp(year, month, day, sHour, sMinute);
        const endTs = DataModule.getTimeStamp(year, month, day, eHour, eMinute);
        const sShow = `${sHour}:${sMinute.toString().padStart(2, '0')}`;
        const eShow = `${eHour}:${eMinute.toString().padStart(2, '0')}`;

        // 时间逻辑校验
        if (startTs >= endTs) {
            alert("结束时间必须晚于开始时间！");
            return;
        }

        // 冲突检测
        if (DataModule.checkConflict(plate, dateStr, startTs, endTs)) {
            alert(`⚠️ 【${plate}】在${dateStr} ${sShow}-${eShow}时间段已被占用！`);
            return;
        }

        // 添加记录
        DataModule.records.push({
            plate,
            dateStr,
            unit,
            user: userName,
            reason,
            startTime: startTs,
            endTime: endTs,
            sShow,
            eShow
        });

        // 排序并保存
        DataModule.records.sort((a, b) => a.startTime - b.startTime || a.plate.localeCompare(b.plate));
        DataModule.saveAll();
        TableModule.renderRecords();
        
        alert("✅ 申请占用成功！");
        // 清空时间输入框（保留车牌/单位/使用人/事由，方便连续登记）
        this.fillCurrentTime();
    },

    // 删除登记记录
    deleteRecord(index) {
        if (!DataModule.isAdmin) return;
        if (confirm("确定要删除这条登记记录吗？")) {
            DataModule.records.splice(index, 1);
            DataModule.saveAll();
            TableModule.renderRecords();
        }
    }
};

// 页面初始化
window.onload = function() {
    // 初始化数据
    DataModule.init();
    // 初始化下拉框
    SelectModule.initAll();
    // 填充当前时间
    RecordModule.fillCurrentTime();
    // 渲染表格
    TableModule.renderRecords();
};
</script>
</body>
</html>
